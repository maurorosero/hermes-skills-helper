name: hermes-skills-helper
version: 0.4.0
manifest_version: 2
api_version: 1
description: "Recolector de señales para la mejora de skills: mide uso, desgaste y fallos recurrentes, y entrega los datos con los que decidir si un skill se crea, se mejora o se da de baja. No escribe sobre los skills y no llama al modelo."
author: Mauro Rosero
license: MIT
homepage: https://github.com/maurorosero/hermes-skills-helper
kind: standalone

# El manifest declara exactamente lo que `register()` registra. Un hook o tool declarado
# y no registrado produce un aviso del validador, y anunciar una capacidad que no existe
# es la clase de detalle que hace desconfiar del resto.
provides_hooks:
  - on_session_end
provides_tools:
  - skills_signals
  - skills_report
